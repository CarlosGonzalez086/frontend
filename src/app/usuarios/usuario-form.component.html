<div class="container mt-3" style="max-width: 500px">
  <div class="card">
    <div class="card-header text-center">
      <h3>{{ id ? 'Editar Usuario' : 'Nuevo Usuario' }}</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Foto de perfil -->
        <div class="mb-3 text-center">
          <label class="form-label d-block">Foto de perfil</label>
          <div class="mb-2">
            <img
              [src]="previewUrl || 'assets/default-avatar.png'"
              alt="Avatar"
              class="avatar-preview"
            />
          </div>
          <button type="button" class="btn btn-primary btn-sm" (click)="fileInput.click()">
            Cargar foto
          </button>
          <input
            #fileInput
            type="file"
            style="display: none"
            (change)="onFileSelected($event)"
            accept="image/*"
          />
          <div
            *ngIf="form.get('fotoPerfil')?.invalid && form.get('fotoPerfil')?.touched"
            class="invalid-feedback d-block"
          >
            La foto de perfil es obligatoria
          </div>
        </div>

        <!-- Nombre -->
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input
            type="text"
            class="form-control"
            formControlName="nombre"
            [class.is-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched"
          />
          <div class="invalid-feedback">El nombre es obligatorio</div>
        </div>

        <!-- Usuario (Email) -->
        <div class="mb-3">
          <label class="form-label">Usuario (Email)</label>
          <input
            type="email"
            class="form-control"
            formControlName="usuario"
            [class.is-invalid]="form.get('usuario')?.invalid && form.get('usuario')?.touched"
          />
          <div class="invalid-feedback">El correo es obligatorio y debe ser válido</div>
        </div>

        <!-- Contraseña -->
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            formControlName="password"
            [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
          />
          <div class="invalid-feedback">La contraseña es obligatoria (mín. 6 caracteres)</div>
        </div>

        <!-- Teléfono -->
        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input
            type="text"
            class="form-control"
            formControlName="telefono"
            [class.is-invalid]="form.get('telefono')?.invalid && form.get('telefono')?.touched"
          />
        </div>

        <!-- Perfiles -->
        <div class="mb-3">
          <label class="form-label">Perfiles</label>
          <select
            class="form-select"
            multiple
            [value]="selectedPerfiles"
            (change)="onPerfilesChange($event)"
          >
            <option *ngFor="let perfil of perfiles" [value]="perfil.id">{{ perfil.nombre }}</option>
          </select>
        </div>

        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-primary">{{ id ? 'Actualizar' : 'Guardar' }}</button>
          <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
