<div *ngIf="loading" class="text-center my-3">
  <div class="spinner-border text-primary" role="status"></div>
  <p>Cargando usuarios...</p>
</div>

<div *ngIf="!loading && error" class="alert alert-danger text-center">
  Ocurrió un error al cargar los usuarios.
</div>

<div *ngIf="!loading && !error">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Listado de Usuarios</h2>
    <div class="d-flex gap-3">
      <button class="btn btn-primary" routerLink="/usuarios/create">Nuevo Usuario</button>
      <button class="btn btn-danger" (click)="exportPdf()">Exportar PDF</button>
      <button class="btn btn-success" (click)="exportExcel()">Exportar Excel</button>
    </div>
  </div>

  <table class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>Código</th>
        <th>Usuario</th>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Fecha creación</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of usuarios">
        <td>{{ u.codigo }}</td>
        <td>{{ u.usuario }}</td>
        <td>{{ u.nombre }}</td>
        <td>{{ u.telefono }}</td>
        <td>{{ u.created_at | date : 'dd/MM/yyyy HH:mm' }}</td>
        <td>
          <div class="d-flex gap-2 justify-content-center">
            <button class="btn btn-info btn-sm" (click)="viewUsuario(u.id.toString())">Ver</button>
            <button class="btn btn-warning btn-sm" (click)="editUsuario(u.id.toString())">
              Editar
            </button>
            <button class="btn btn-danger btn-sm" (click)="deleteUsuario(u.id.toString())">
              Eliminar
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
