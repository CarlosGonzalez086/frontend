<app-header *ngIf="isLoggedIn && isBrowser" ngSkipHydration></app-header>

<div
  class="d-flex bg-light"
  *ngIf="isLoggedIn && isBrowser"
  style="min-height: 100vh; padding-top: 70px"
>
  <app-sidebar ngSkipHydration></app-sidebar>

  <main class="flex-grow-1 p-4 overflow-auto" style="margin-left: 0">
    <div class="bg-white rounded-4 shadow-sm p-4 min-vh-100">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<main *ngIf="!isLoggedIn || !isBrowser">
  <router-outlet></router-outlet>
</main>
