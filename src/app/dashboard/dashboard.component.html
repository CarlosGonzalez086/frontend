<div class="container py-5">
  <div class="card border-0 shadow-lg rounded-4 mx-auto overflow-hidden" style="max-width: 550px">
    <div class="bg-primary text-white text-center py-4">
      <div
        class="bg-white bg-opacity-25 rounded-circle d-inline-flex justify-content-center align-items-center mb-3"
        style="width: 90px; height: 90px"
      >
        <i class="bi bi-speedometer2 fs-1"></i>
      </div>

      <h3 class="fw-bold mb-1">Dashboard</h3>

      <p class="mb-0 opacity-75">Panel principal del sistema</p>
    </div>

    <div class="card-body text-center p-5">
      <h5 class="text-muted mb-2">Bienvenido de nuevo</h5>

      <h2 class="fw-bold mb-4">
        {{ user?.name || user?.nombre }}
      </h2>

      <button class="btn btn-danger px-4 py-2 rounded-3 shadow-sm" (click)="logout()">
        <i class="bi bi-box-arrow-right me-2"></i>
        Cerrar sesión
      </button>
    </div>
  </div>
</div>
