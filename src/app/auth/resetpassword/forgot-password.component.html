<!-- forgot-password.component.html -->
<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="card p-4 shadow" style="max-width: 400px; width: 100%">
    <h2 class="text-center mb-4">Recuperar Contraseña</h2>

    <div *ngIf="mensaje" class="alert alert-success text-center">{{ mensaje }}</div>
    <div *ngIf="error" class="alert alert-danger text-center">{{ error }}</div>

    <form (ngSubmit)="enviarCorreo()">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" id="email" class="form-control" [(ngModel)]="email" name="email" required placeholder="tu@email.com">
      </div>

      <button type="submit" class="btn btn-primary w-100">Enviar correo</button>
    </form>

    <p class="text-center mt-3">
      <a (click)="irLogin()" class="text-decoration-none" style="cursor: pointer">Regresar al login</a>
    </p>
  </div>
</div>
