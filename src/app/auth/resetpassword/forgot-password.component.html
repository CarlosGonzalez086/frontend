<div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
  <div
    class="card border-0 shadow-lg rounded-4 overflow-hidden"
    style="max-width: 450px; width: 100%"
  >
    <div class="bg-primary text-white text-center p-4">
      <div
        class="bg-white bg-opacity-25 rounded-circle d-inline-flex justify-content-center align-items-center mb-3"
        style="width: 80px; height: 80px"
      >
        <i class="bi bi-shield-lock-fill fs-1"></i>
      </div>
      <h2 class="fw-bold mb-2">Recuperar Contraseña</h2>
      <p class="mb-0 opacity-75">Ingresa tu correo electrónico para recuperar tu cuenta</p>
    </div>
    <div class="card-body p-4">
      <div *ngIf="mensaje" class="alert alert-success border-0 rounded-3 shadow-sm">
        <i class="bi bi-check-circle-fill me-2"></i>
        {{ mensaje }}
      </div>

      <div *ngIf="error" class="alert alert-danger border-0 rounded-3 shadow-sm">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        {{ error }}
      </div>
      <form (ngSubmit)="enviarCorreo()">
        <div class="mb-4">
          <label for="email" class="form-label fw-semibold"> Correo electrónico </label>

          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="bi bi-envelope text-muted"></i>
            </span>

            <input
              type="email"
              id="email"
              class="form-control"
              [(ngModel)]="email"
              name="email"
              required
              placeholder="tu@email.com"
            />
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 rounded-3 shadow-sm py-2 fw-semibold">
          <i class="bi bi-send-fill me-2"></i>
          Enviar correo
        </button>
      </form>
      <div class="text-center mt-4">
        <a (click)="irLogin()" class="text-decoration-none fw-semibold" style="cursor: pointer">
          <i class="bi bi-arrow-left me-1"></i>
          Regresar al login
        </a>
      </div>
    </div>
  </div>
</div>
