<div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
  <div
    class="card border-0 shadow-lg rounded-4 overflow-hidden"
    style="max-width: 450px; width: 100%"
  >
    <div class="bg-primary text-white text-center p-4">
      <div
        class="bg-white bg-opacity-25 rounded-circle d-inline-flex justify-content-center align-items-center mb-3"
        style="width: 80px; height: 80px"
      >
        <i class="bi bi-key-fill fs-1"></i>
      </div>
      <h2 class="fw-bold mb-2">Restablecer Contraseña</h2>
      <p class="mb-0 opacity-75">Ingresa tu nueva contraseña para continuar</p>
    </div>
    <div class="card-body p-4">
      <div *ngIf="mensaje" class="alert alert-success border-0 rounded-3 shadow-sm">
        <i class="bi bi-check-circle-fill me-2"></i>
        {{ mensaje }}
      </div>

      <div *ngIf="error" class="alert alert-danger border-0 rounded-3 shadow-sm">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        {{ error }}
      </div>
      <form (ngSubmit)="resetPassword()">
        <div class="mb-4">
          <label for="newPassword" class="form-label fw-semibold"> Nueva contraseña </label>

          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="bi bi-lock-fill text-muted"></i>
            </span>

            <input
              type="password"
              id="newPassword"
              class="form-control"
              [(ngModel)]="newPassword"
              name="newPassword"
              required
              placeholder="••••••••"
            />
          </div>
        </div>
        <div class="mb-4">
          <label for="confirmPassword" class="form-label fw-semibold"> Confirmar contraseña </label>

          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="bi bi-shield-lock-fill text-muted"></i>
            </span>

            <input
              type="password"
              id="confirmPassword"
              class="form-control"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              required
              placeholder="••••••••"
            />
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 rounded-3 shadow-sm py-2 fw-semibold">
          <i class="bi bi-arrow-repeat me-2"></i>
          Restablecer contraseña
        </button>
      </form>
      <div class="text-center mt-4">
        <a routerLink="/login" class="text-decoration-none fw-semibold">
          <i class="bi bi-arrow-left me-1"></i>
          Regresar al login
        </a>
      </div>
    </div>
  </div>
</div>
