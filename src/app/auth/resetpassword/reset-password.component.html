<!-- reset-password.component.html -->
<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="card p-4 shadow" style="max-width: 400px; width: 100%">
    <h2 class="text-center mb-4">Restablecer Contraseña</h2>

    <div *ngIf="mensaje" class="alert alert-success text-center">{{ mensaje }}</div>
    <div *ngIf="error" class="alert alert-danger text-center">{{ error }}</div>

    <form (ngSubmit)="resetPassword()">
      <div class="mb-3">
        <label for="newPassword" class="form-label">Nueva contraseña</label>
        <input type="password" id="newPassword" class="form-control" [(ngModel)]="newPassword" name="newPassword" required>
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Restablecer</button>
    </form>

    <p class="text-center mt-3">
      <a routerLink="/login" class="text-decoration-none">Regresar al login</a>
    </p>
  </div>
</div>
