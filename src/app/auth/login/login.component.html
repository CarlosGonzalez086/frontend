<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center bg-light">
  <div class="card border-0 shadow-lg rounded-4 p-4" style="max-width: 420px; width: 100%">
    <div class="text-center mb-4">
      <h2 class="fw-bold mb-1">Bienvenido</h2>

      <p class="text-muted mb-0">Inicia sesión para continuar</p>
    </div>

    <div *ngIf="mensajeError" class="alert alert-danger text-center py-2">
      {{ mensajeError }}
    </div>

    <form (ngSubmit)="login()">
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold"> Correo electrónico </label>

        <div class="input-group">
          <span class="input-group-text bg-white">
            <i class="bi bi-envelope text-muted"></i>
          </span>

          <input
            type="email"
            id="email"
            class="form-control"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="tu@email.com"
          />
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold"> Contraseña </label>

        <div class="input-group">
          <span class="input-group-text bg-white">
            <i class="bi bi-lock text-muted"></i>
          </span>

          <input
            type="password"
            id="password"
            class="form-control"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="••••••••"
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
        Iniciar Sesión
      </button>
    </form>

    <div class="text-center mt-4">
      <p class="mb-2 text-muted">
        ¿No tienes cuenta?

        <a (click)="irRegistro()" class="text-decoration-none fw-semibold" style="cursor: pointer">
          Regístrate aquí
        </a>
      </p>

      <a
        (click)="irRecuperarContrasena()"
        class="text-decoration-none small"
        style="cursor: pointer"
      >
        ¿Olvidaste tu contraseña?
      </a>
    </div>
  </div>
</div>
