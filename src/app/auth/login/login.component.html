<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="card p-4 shadow" style="max-width: 400px; width: 100%">
    <h2 class="text-center mb-4">Iniciar Sesión</h2>

    <!-- Mensaje de error -->
    <div *ngIf="mensajeError" class="alert alert-danger text-center">
      {{ mensajeError }}
    </div>

    <form (ngSubmit)="login()">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="tu@email.com"
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input
          type="password"
          id="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="••••••••"
        />
      </div>

      <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
    </form>

    <p class="text-center mt-3">
      ¿No tienes cuenta?
      <a (click)="irRegistro()" class="text-decoration-none" style="cursor: pointer">
        Regístrate aquí
      </a>
    </p>
    <p class="text-center mt-2">
      <a (click)="irRecuperarContrasena()" class="text-decoration-none" style="cursor: pointer">
        ¿Olvidaste tu contraseña?
      </a>
    </p>
  </div>
</div>
