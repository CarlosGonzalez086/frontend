<div class="container-fluid py-4">
  <div *ngIf="loading" class="d-flex flex-column align-items-center justify-content-center py-5">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>

    <p class="mt-3 text-muted fw-semibold">Cargando productos...</p>
  </div>

  <div
    *ngIf="!loading && error"
    class="alert alert-danger border-0 shadow-sm rounded-4 text-center"
  >
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    Ocurrió un error al cargar los productos.
  </div>

  <div *ngIf="!loading && !error">
    <div class="card border-0 shadow-sm rounded-4 mb-4">
      <div class="card-body">
        <div
          class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3"
        >
          <div>
            <h2 class="fw-bold mb-1">Productos</h2>
          </div>

          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-primary rounded-3 shadow-sm" routerLink="/productos/create">
              <i class="bi bi-plus-circle me-2"></i>
              Nuevo Producto
            </button>

            <button class="btn btn-danger rounded-3 shadow-sm" (click)="exportPdf()">
              <i class="bi bi-file-earmark-pdf me-2"></i>
              Exportar PDF
            </button>

            <button class="btn btn-success rounded-3 shadow-sm" (click)="exportExcel()">
              <i class="bi bi-file-earmark-excel me-2"></i>
              Exportar Excel
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="fw-semibold">Código</th>
              <th class="fw-semibold">Nombre</th>
              <th class="fw-semibold">Marca</th>
              <th class="fw-semibold">Precio</th>
              <th class="fw-semibold">Fecha creación</th>
              <th class="fw-semibold text-center">Acciones</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let p of productos">
              <td>
                <span class="badge bg-dark">
                  {{ p.codigo }}
                </span>
              </td>

              <td class="fw-semibold">
                {{ p.nombre }}
              </td>

              <td>
                <span class="text-muted">
                  {{ p.marca }}
                </span>
              </td>

              <td>
                <span class="fw-semibold text-success"> $ {{ p.precio | number: '1.0-0' }} </span>
              </td>

              <td>
                {{ p.created_at | date: 'dd/MM/yyyy HH:mm' }}
              </td>

              <td>
                <div class="d-flex gap-2 justify-content-center flex-wrap">
                  <button
                    class="btn btn-outline-info btn-sm rounded-3"
                    (click)="viewProducto(p.id)"
                  >
                    <i class="bi bi-eye"></i>
                  </button>

                  <button
                    class="btn btn-outline-warning btn-sm rounded-3"
                    (click)="editProducto(p.id)"
                  >
                    <i class="bi bi-pencil-square"></i>
                  </button>

                  <button
                    class="btn btn-outline-danger btn-sm rounded-3"
                    (click)="deleteProducto(p.id)"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>

            <tr *ngIf="productos.length === 0">
              <td colspan="6" class="text-center py-5 text-muted">
                <i class="bi bi-box-seam fs-1 d-block mb-2"></i>

                No hay productos registrados.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
