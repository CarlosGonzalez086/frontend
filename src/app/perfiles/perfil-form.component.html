<div class="container mt-3" style="max-width: 500px">
  <div class="card">
    <div class="card-header text-center">
      <h3>{{ id ? 'Editar Perfil' : 'Nuevo Perfil' }}</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Código -->
        <div class="mb-3">
          <label class="form-label">Código</label>
          <input type="text" class="form-control" formControlName="codigo"
            [class.is-invalid]="form.get('codigo')?.invalid && form.get('codigo')?.touched" />
          <div class="invalid-feedback">El código es obligatorio</div>
        </div>

        <!-- Nombre -->
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" formControlName="nombre"
            [class.is-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched" />
          <div class="invalid-feedback">El nombre es obligatorio</div>
        </div>

        <!-- Secciones -->
        <div class="mb-3">
          <label class="form-label">Secciones (coma separado)</label>
          <input type="text" class="form-control" formControlName="secciones" />
        </div>

        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-primary">{{ id ? 'Actualizar' : 'Guardar' }}</button>
          <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
