<!-- Cargando perfiles -->
<div *ngIf="loading" class="text-center my-3">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
  <p class="mt-2">Cargando perfiles...</p>
</div>

<!-- Error -->
<div *ngIf="!loading && error" class="alert alert-danger text-center">
  Ocurrió un error al cargar los perfiles.
</div>

<!-- Tabla -->
<div *ngIf="!loading && !error">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Listado de Perfiles</h2>
    <div class="d-flex gap-3">
      <button class="btn btn-success" routerLink="/perfiles/create">Nuevo Perfil</button>
      <button class="btn btn-danger" (click)="exportPdf()">Exportar PDF</button>
      <button class="btn btn-success" (click)="exportExcel()">Exportar Excel</button>
    </div>
  </div>

  <table class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Secciones</th>
        <th>Fecha creación</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of perfiles">
        <td>{{ p.codigo }}</td>
        <td>{{ p.nombre }}</td>
        <td>{{ p.secciones?.join(', ') }}</td>
        <td>{{ p.created_at | date : 'dd/MM/yyyy HH:mm' }}</td>
        <td>
          <div class="d-flex gap-2 justify-content-center">
            <button class="btn btn-info btn-sm" (click)="viewPerfil(p.id)">Ver</button>
            <button class="btn btn-warning btn-sm" (click)="editPerfil(p.id)">Editar</button>
            <button class="btn btn-danger btn-sm" (click)="deletePerfil(p.id)">Eliminar</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
